<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qué asco das bro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 107, 139, 0.15), transparent 50%), radial-gradient(circle at 80% 70%, rgba(255, 184, 198, 0.1), transparent 50%);
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      background: #1e1e1e;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 30px rgba(255, 107, 139, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #ff6b8b;
      text-shadow: 0 0 10px rgba(255, 107, 139, 0.7);
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .heart {
      font-size: 40px;
      color: #ff6b8b;
      animation: pulse 2s infinite;
      margin-bottom: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart"><i class="fas fa-heart-broken"></i></div>
    <h1>Qué asco das bro</h1>
    <p>Será linda por fuera, pero por dentro eres una mierda. Porfa mejora.</p>
  </div>
</body>
</html>
